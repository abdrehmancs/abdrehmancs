<svg viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#161010"/>
      <stop offset="55%" stop-color="#0a0707"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="panelFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.04"/>
    </linearGradient>

    <!-- strong neon glow for primary accents -->
    <filter id="neon" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b1"/>
      <feGaussianBlur stdDeviation="10" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- soft glow for secondary lines/text -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="600" height="480" rx="20" fill="url(#bg)"/>

  <!-- ambient red glow blobs for atmosphere behind the glass -->
  <circle cx="120" cy="90" r="90" fill="#e11d48" opacity="0.22" filter="url(#ambientBlur)"/>
  <circle cx="500" cy="400" r="110" fill="#f43f5e" opacity="0.16" filter="url(#ambientBlur)"/>

  <!-- glass panel -->
  <rect x="40" y="64" width="520" height="392" rx="26" fill="url(#panelFill)" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="41" y="65" width="518" height="390" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <ellipse cx="300" cy="95" rx="240" ry="34" fill="url(#shine)"/>

  <!-- title -->
  <text x="300" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="bold" fill="#f43f5e" letter-spacing="2" filter="url(#softGlow)">
    🕷️ SPIDER-SENSE SKILL RADAR
  </text>
  <text x="300" y="52" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#9ca3af" letter-spacing="1">
    web integrity by discipline
  </text>

  <g>
    <!-- web rings -->
    <polygon points="300,146 417.9,231.7 372.9,370.3 227.1,370.3 182.1,231.7" fill="none" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
    <polygon points="300,177 388.4,241.3 354.7,345.2 245.3,345.2 211.6,241.3" fill="none" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
    <polygon points="300,208 359,250.8 336.5,320.2 263.5,320.2 241,250.8" fill="none" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
    <polygon points="300,239 329.5,260.4 318.2,295.1 281.8,295.1 270.5,260.4" fill="none" stroke="#7f1d1d" stroke-width="1" opacity="0.5"/>
    <polygon points="300,115 447.4,222.1 391.1,395.4 208.9,395.4 152.6,222.1" fill="none" stroke="#f43f5e" stroke-width="1.4" opacity="0.75" filter="url(#softGlow)"/>

    <!-- radial threads -->
    <line x1="300" y1="270" x2="300" y2="115" stroke="#f43f5e" stroke-width="0.9" opacity="0.35"/>
    <line x1="300" y1="270" x2="447.4" y2="222.1" stroke="#f43f5e" stroke-width="0.9" opacity="0.35"/>
    <line x1="300" y1="270" x2="391.1" y2="395.4" stroke="#f43f5e" stroke-width="0.9" opacity="0.35"/>
    <line x1="300" y1="270" x2="208.9" y2="395.4" stroke="#f43f5e" stroke-width="0.9" opacity="0.35"/>
    <line x1="300" y1="270" x2="152.6" y2="222.1" stroke="#f43f5e" stroke-width="0.9" opacity="0.35"/>

    <!-- cross threads -->
    <line x1="300" y1="115" x2="391.1" y2="395.4" stroke="#7f1d1d" stroke-width="0.5" opacity="0.3"/>
    <line x1="447.4" y1="222.1" x2="208.9" y2="395.4" stroke="#7f1d1d" stroke-width="0.5" opacity="0.3"/>
    <line x1="391.1" y1="395.4" x2="152.6" y2="222.1" stroke="#7f1d1d" stroke-width="0.5" opacity="0.3"/>

    <!-- data polygon: Python 90 / C++ 70 / ML-AI 85 / Data Sci 80 / Debugging 95 -->
    <polygon points="300,130.5 403.17,236.47 377.47,376.6 227.09,370.3 159.97,224.5"
             fill="#e11d48" fill-opacity="0.30" stroke="#f43f5e" stroke-width="2.4" filter="url(#neon)"/>

    <circle cx="300" cy="130.5" r="4.5" fill="#ff2d55" filter="url(#neon)"/>
    <circle cx="403.17" cy="236.47" r="4.5" fill="#ff2d55" filter="url(#neon)"/>
    <circle cx="377.47" cy="376.6" r="4.5" fill="#ff2d55" filter="url(#neon)"/>
    <circle cx="227.09" cy="370.3" r="4.5" fill="#ff2d55" filter="url(#neon)"/>
    <circle cx="159.97" cy="224.5" r="4.5" fill="#ff2d55" filter="url(#neon)"/>

    <!-- axis labels -->
    <text x="300" y="80" text-anchor="middle" font-family="monospace" font-size="12" fill="#f4f4f5" font-weight="bold">PYTHON</text>
    <text x="300" y="94" text-anchor="middle" font-family="monospace" font-size="10" fill="#fb7185">90%</text>

    <text x="475" y="209" text-anchor="start" font-family="monospace" font-size="12" fill="#f4f4f5" font-weight="bold">C++</text>
    <text x="475" y="223" text-anchor="start" font-family="monospace" font-size="10" fill="#fb7185">70%</text>

    <text x="405" y="428" text-anchor="middle" font-family="monospace" font-size="12" fill="#f4f4f5" font-weight="bold">ML / AI</text>
    <text x="405" y="442" text-anchor="middle" font-family="monospace" font-size="10" fill="#fb7185">85%</text>

    <text x="195" y="428" text-anchor="middle" font-family="monospace" font-size="12" fill="#f4f4f5" font-weight="bold">DATA SCIENCE</text>
    <text x="195" y="442" text-anchor="middle" font-family="monospace" font-size="10" fill="#fb7185">80%</text>

    <text x="126" y="209" text-anchor="end" font-family="monospace" font-size="12" fill="#f4f4f5" font-weight="bold">DEBUGGING</text>
    <text x="126" y="223" text-anchor="end" font-family="monospace" font-size="10" fill="#fb7185">95%</text>
  </g>
</svg>
