<svg viewBox="0 0 600 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="600" height="620" rx="18" fill="url(#bg)"/>

  <text x="300" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#f43f5e" letter-spacing="2">
    🕷️ SPIDER-SENSE SKILL RADAR
  </text>
  <text x="300" y="58" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">
    web integrity by discipline
  </text>

  <g transform="translate(0,25)">
    <!-- web rings -->
    <polygon points="300,124 467.38,245.62 403.49,442.38 196.51,442.38 132.62,245.62" fill="none" stroke="#7f1d1d" stroke-width="1" opacity="0.55"/>
    <polygon points="300,168 425.53,259.21 377.62,406.79 222.38,406.79 174.47,259.21" fill="none" stroke="#7f1d1d" stroke-width="1" opacity="0.55"/>
    <polygon points="300,212 383.69,272.81 351.74,371.19 248.26,371.19 216.31,272.81" fill="none" stroke="#7f1d1d" stroke-width="1" opacity="0.55"/>
    <polygon points="300,256 341.84,286.4 325.87,335.6 274.13,335.6 258.16,286.4" fill="none" stroke="#7f1d1d" stroke-width="1" opacity="0.55"/>
    <polygon points="300,80 509.22,232.02 429.36,477.98 170.64,477.98 90.78,232.02" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0.8"/>

    <!-- radial threads -->
    <line x1="300" y1="300" x2="300" y2="80" stroke="#f43f5e" stroke-width="1" opacity="0.4"/>
    <line x1="300" y1="300" x2="509.22" y2="232.02" stroke="#f43f5e" stroke-width="1" opacity="0.4"/>
    <line x1="300" y1="300" x2="429.36" y2="477.98" stroke="#f43f5e" stroke-width="1" opacity="0.4"/>
    <line x1="300" y1="300" x2="170.64" y2="477.98" stroke="#f43f5e" stroke-width="1" opacity="0.4"/>
    <line x1="300" y1="300" x2="90.78" y2="232.02" stroke="#f43f5e" stroke-width="1" opacity="0.4"/>

    <!-- cross threads for extra web texture -->
    <line x1="300" y1="80" x2="429.36" y2="477.98" stroke="#7f1d1d" stroke-width="0.6" opacity="0.35"/>
    <line x1="509.22" y1="232.02" x2="170.64" y2="477.98" stroke="#7f1d1d" stroke-width="0.6" opacity="0.35"/>
    <line x1="429.36" y1="477.98" x2="90.78" y2="232.02" stroke="#7f1d1d" stroke-width="0.6" opacity="0.35"/>

    <!-- data polygon: Python 90 / C++ 70 / ML-AI 85 / Data Sci 80 / Debugging 95 -->
    <polygon points="300,102 446.45,252.41 409.96,451.28 196.51,442.38 101.24,235.42"
             fill="#e11d48" fill-opacity="0.35" stroke="#facc15" stroke-width="2.5" filter="url(#glow)"/>

    <circle cx="300" cy="102" r="5" fill="#facc15"/>
    <circle cx="446.45" cy="252.41" r="5" fill="#facc15"/>
    <circle cx="409.96" cy="451.28" r="5" fill="#facc15"/>
    <circle cx="196.51" cy="442.38" r="5" fill="#facc15"/>
    <circle cx="101.24" cy="235.42" r="5" fill="#facc15"/>

    <!-- axis labels -->
    <text x="300" y="55" text-anchor="middle" font-family="monospace" font-size="13" fill="#f1f5f9" font-weight="bold">PYTHON</text>
    <text x="300" y="70" text-anchor="middle" font-family="monospace" font-size="11" fill="#f43f5e">90%</text>

    <text x="548" y="217" text-anchor="start" font-family="monospace" font-size="13" fill="#f1f5f9" font-weight="bold">C++</text>
    <text x="548" y="232" text-anchor="start" font-family="monospace" font-size="11" fill="#f43f5e">70%</text>

    <text x="448" y="510" text-anchor="middle" font-family="monospace" font-size="13" fill="#f1f5f9" font-weight="bold">ML / AI</text>
    <text x="448" y="525" text-anchor="middle" font-family="monospace" font-size="11" fill="#f43f5e">85%</text>

    <text x="151" y="510" text-anchor="middle" font-family="monospace" font-size="13" fill="#f1f5f9" font-weight="bold">DATA SCIENCE</text>
    <text x="151" y="525" text-anchor="middle" font-family="monospace" font-size="11" fill="#f43f5e">80%</text>

    <text x="52" y="217" text-anchor="end" font-family="monospace" font-size="13" fill="#f1f5f9" font-weight="bold">DEBUGGING</text>
    <text x="52" y="232" text-anchor="end" font-family="monospace" font-size="11" fill="#f43f5e">95%</text>
  </g>

  <text x="300" y="605" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">
    "no bug escapes the web" — updated by hand, no external service required
  </text>
</svg>
