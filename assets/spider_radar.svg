<svg width="720" height="520" viewBox="0 0 720 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </radialGradient>
    <linearGradient id="webLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="senseFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="520" rx="24" fill="url(#bgGlow)"/>
  <text x="360" y="48" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial" font-size="26" font-weight="700">
    🕷️ Spider-Sense Radar
  </text>
  <text x="360" y="74" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="14">
    Signal strength of core dev powers
  </text>

  <!-- Radar center -->
  <g transform="translate(360,280)">
    <!-- Web rings -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" stroke="#334155" stroke-width="1.2" fill="none"/>
    <polygon points="0,-144 125,-72 125,72 0,144 -125,72 -125,-72" stroke="#334155" stroke-width="1.2" fill="none"/>
    <polygon points="0,-108 94,-54 94,54 0,108 -94,54 -94,-54" stroke="#334155" stroke-width="1.2" fill="none"/>
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" stroke="#334155" stroke-width="1.2" fill="none"/>
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" stroke="#334155" stroke-width="1.2" fill="none"/>

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="-180" stroke="url(#webLine)" stroke-width="2"/>
    <line x1="0" y1="0" x2="156" y2="-90" stroke="url(#webLine)" stroke-width="2"/>
    <line x1="0" y1="0" x2="156" y2="90" stroke="url(#webLine)" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="url(#webLine)" stroke-width="2"/>
    <line x1="0" y1="0" x2="-156" y2="90" stroke="url(#webLine)" stroke-width="2"/>
    <line x1="0" y1="0" x2="-156" y2="-90" stroke="url(#webLine)" stroke-width="2"/>

    <!-- Data polygon (0-100 scaled to radius 180) -->
    <!-- Values: ML 88, Python 92, DS 84, C++ 76, OSS 70, Problem Solving 90 -->
    <polygon
      points="
        0,-158
        143,-83
        131,76
        0,137
        -109,63
        -140,-81
      "
      fill="url(#senseFill)"
      stroke="#f43f5e"
      stroke-width="3"
      filter="url(#softGlow)"
    />

    <!-- Data points -->
    <circle cx="0" cy="-158" r="5" fill="#f8fafc"/>
    <circle cx="143" cy="-83" r="5" fill="#f8fafc"/>
    <circle cx="131" cy="76" r="5" fill="#f8fafc"/>
    <circle cx="0" cy="137" r="5" fill="#f8fafc"/>
    <circle cx="-109" cy="63" r="5" fill="#f8fafc"/>
    <circle cx="-140" cy="-81" r="5" fill="#f8fafc"/>

    <!-- Labels -->
    <text x="0" y="-198" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Segoe UI, Arial">ML/AI</text>
    <text x="183" y="-98" text-anchor="start" fill="#e2e8f0" font-size="14" font-family="Segoe UI, Arial">Python</text>
    <text x="183" y="104" text-anchor="start" fill="#e2e8f0" font-size="14" font-family="Segoe UI, Arial">Data Science</text>
    <text x="0" y="210" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Segoe UI, Arial">C++</text>
    <text x="-183" y="104" text-anchor="end" fill="#e2e8f0" font-size="14" font-family="Segoe UI, Arial">Open Source</text>
    <text x="-183" y="-98" text-anchor="end" fill="#e2e8f0" font-size="14" font-family="Segoe UI, Arial">Problem Solving</text>
  </g>
</svg>
