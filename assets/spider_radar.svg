<svg width="900" height="620" viewBox="0 0 900 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#131a2b"/>
      <stop offset="100%" stop-color="#090d18"/>
    </radialGradient>

    <!-- Web line gradient -->
    <linearGradient id="webLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Data fill -->
    <linearGradient id="dataFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Scan cone gradient -->
    <radialGradient id="scanFade" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft big glow -->
    <filter id="bigGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="880" height="600" rx="28" fill="url(#bg)" stroke="#1F2937" stroke-width="2"/>

  <!-- Header -->
  <text x="450" y="58" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">
    🕷️ Spider-Sense Radar V2
  </text>
  <text x="450" y="86" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="16">
    Live signal map of Abdul Rehman's developer powers
  </text>

  <!-- Radar Group -->
  <g transform="translate(450,335)">
    <!-- Pulsing outer aura -->
    <circle r="225" fill="none" stroke="#1D4ED8" stroke-opacity="0.20" stroke-width="2" filter="url(#bigGlow)">
      <animate attributeName="r" values="218;228;218" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.10;0.28;0.10" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Rotating scan cone -->
    <g>
      <path d="M0,0 L0,-220 A220,220 0 0 1 82,-204 Z" fill="url(#scanFade)" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/>
      </path>
      <line x1="0" y1="0" x2="0" y2="-220" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="2.2" filter="url(#glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Web rings -->
    <polygon points="0,-220 191,-110 191,110 0,220 -191,110 -191,-110" fill="none" stroke="#334155" stroke-width="1.3"/>
    <polygon points="0,-176 153,-88 153,88 0,176 -153,88 -153,-88" fill="none" stroke="#334155" stroke-width="1.3"/>
    <polygon points="0,-132 115,-66 115,66 0,132 -115,66 -115,-66" fill="none" stroke="#334155" stroke-width="1.3"/>
    <polygon points="0,-88 76,-44 76,44 0,88 -76,44 -76,-44" fill="none" stroke="#334155" stroke-width="1.3"/>
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="#334155" stroke-width="1.3"/>

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="-220" stroke="url(#webLine)" stroke-width="2"/>
    <line x1="0" y1="0" x2="191" y2="-110" stroke="url(#webLine)" stroke-width="2"/>
    <line x1="0" y1="0" x2="191" y2="110" stroke="url(#webLine)" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="url(#webLine)" stroke-width="2"/>
    <line x1="0" y1="0" x2="-191" y2="110" stroke="url(#webLine)" stroke-width="2"/>
    <line x1="0" y1="0" x2="-191" y2="-110" stroke="url(#webLine)" stroke-width="2"/>

    <!-- Animated data polygon -->
    <!-- Base values (out of 100): ML 88, Python 92, Data 84, C++ 76, OSS 70, Problem 90 -->
    <polygon id="radarData"
      points="0,-194 176,-101 161,93 0,167 -134,77 -172,-99"
      fill="url(#dataFill)"
      stroke="#F43F5E"
      stroke-width="3"
      filter="url(#glow)">
      <animate attributeName="points"
        dur="4.2s"
        repeatCount="indefinite"
        values="
          0,-194 176,-101 161,93 0,167 -134,77 -172,-99;
          0,-186 170,-98 154,89 0,160 -128,74 -166,-96;
          0,-194 176,-101 161,93 0,167 -134,77 -172,-99
        "/>
    </polygon>

    <!-- Data points -->
    <g fill="#F8FAFC">
      <circle cx="0" cy="-194" r="5.2">
        <animate attributeName="r" values="4.2;6.4;4.2" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="176" cy="-101" r="5.2"><animate attributeName="r" values="4.2;6.4;4.2" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="161" cy="93" r="5.2"><animate attributeName="r" values="4.2;6.4;4.2" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="0" cy="167" r="5.2"><animate attributeName="r" values="4.2;6.4;4.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="-134" cy="77" r="5.2"><animate attributeName="r" values="4.2;6.4;4.2" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="-172" cy="-99" r="5.2"><animate attributeName="r" values="4.2;6.4;4.2" dur="1.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Center -->
    <circle r="8" fill="#E2E8F0"/>
    <circle r="14" fill="none" stroke="#E2E8F0" stroke-opacity="0.6">
      <animate attributeName="r" values="10;18;10" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.65;0.15;0.65" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Axis labels -->
    <text x="0" y="-250" text-anchor="middle" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial">ML / AI</text>
    <text x="220" y="-120" text-anchor="start" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial">Python</text>
    <text x="220" y="128" text-anchor="start" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial">Data Science</text>
    <text x="0" y="252" text-anchor="middle" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial">C++</text>
    <text x="-220" y="128" text-anchor="end" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial">Open Source</text>
    <text x="-220" y="-120" text-anchor="end" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial">Problem Solving</text>
  </g>

  <!-- Footer line -->
  <text x="450" y="585" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    “The web shows not just where you are strong — but where to swing next.”
  </text>
</svg>
